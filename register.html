<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Register - StudentKart</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>



    <!-- =========================
         REGISTER CONTAINER
    ========================== -->

    <div class="login-container">

        <div class="login-box">

            <img
            src="logo.jpeg"
            class="login-logo">

            <h2>
                Create Account
            </h2>



            <input
            type="text"
            id="name"
            placeholder="Enter Full Name">



            <input
            type="email"
            id="email"
            placeholder="Enter Email">



            <input
            type="password"
            id="password"
            placeholder="Enter Password">



            <button onclick="registerUser()">

                Register

            </button>



            <p>

                Already have an account?

                <a href="login.html">

                    Login

                </a>

            </p>



            <a href="index.html"
            class="back-link">

                ← Back To Home

            </a>

        </div>

    </div>



    <script src="script.js"></script>

</body>
</html>
