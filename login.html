<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Login - StudentKart</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>



    <!-- =========================
         LOGIN BOX
    ========================== -->

    <div class="login-container">

        <div class="login-box">

            <img
            src="logo.jpeg"
            class="login-logo">

            <h2>
                User Login
            </h2>

            <input
            type="email"
            id="email"
            placeholder="Enter Email">

            <input
            type="password"
            id="password"
            placeholder="Enter Password">

            <button onclick="loginUser()">
                Login
            </button>

            <p>

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

            <a href="index.html"
            class="back-link">

                ← Back To Home

            </a>

        </div>

    </div>



    <script src="script.js"></script>

</body>
</html>
