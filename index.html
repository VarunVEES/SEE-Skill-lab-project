<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>StudentKart</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>



    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="logo-section">

            <img
            src="logo.jpeg"
            class="logo">

            <h1>StudentKart</h1>

        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

            <a href="register.html">
                Register
            </a>

            <a href="admin-login.html">
                Admin Login
            </a>

        </nav>

    </header>



    <!-- =========================
         HERO SECTION
    ========================== -->

    <section class="hero">

        <h2>
            Student Shopping Made Easy
        </h2>

        <p>
            Buy calculators, notebooks,
            lab coats, engineering tools
            and more.
        </p>

        <div class="hero-buttons">

            <a href="login.html">

                <button>
                    Login
                </button>

            </a>

            <a href="register.html">

                <button>
                    Register
                </button>

            </a>

        </div>

    </section>



    <!-- =========================
         FEATURES
    ========================== -->

    <section class="features">

        <div class="feature-box">

            <h3>
                Affordable Products
            </h3>

            <p>
                Student friendly prices.
            </p>

        </div>



        <div class="feature-box">

            <h3>
                Easy Ordering
            </h3>

            <p>
                Simple checkout process.
            </p>

        </div>



        <div class="feature-box">

            <h3>
                Cash On Delivery
            </h3>

            <p>
                Pay after receiving products.
            </p>

        </div>

    </section>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            © 2026 StudentKart
        </p>

    </footer>



</body>
</html>
