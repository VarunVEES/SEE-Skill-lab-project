<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Admin Login - StudentKart</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>



    <!-- =========================
         ADMIN LOGIN
    ========================== -->

    <div class="login-container">

        <div class="login-box">

            <img
            src="logo.jpeg"
            class="login-logo">

            <h2>
                Admin Login
            </h2>



            <input
            type="text"
            id="adminUsername"
            placeholder="Enter Admin Username">



            <input
            type="password"
            id="adminPassword"
            placeholder="Enter Password">



            <button onclick="adminLogin()">

                Login

            </button>



            <a href="index.html"
            class="back-link">

                ← Back To Home

            </a>

        </div>

    </div>



    <script src="admin.js"></script>

</body>
</html>
