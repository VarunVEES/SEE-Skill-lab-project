<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - StudentKart</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>



    <!-- =========================
         HEADER
    ========================== -->

    <header>

        <div class="logo-section">

            <img
            src="logo.jpeg"
            class="logo">

            <h1>Admin Dashboard</h1>

        </div>



        <nav>

            <a href="add-product.html">

                Add Product

            </a>

            <a href="view-orders.html">

                View Orders

            </a>

            <a href="view-customers.html">

                View Customers

            </a>

            <a href="index.html">

                Logout

            </a>

        </nav>

    </header>



    <!-- =========================
         DASHBOARD SECTION
    ========================== -->

    <section class="admin-dashboard-section">

        <h2>
            Welcome Admin
        </h2>

        <p>
            Manage products, customers
            and orders from here.
        </p>



        <div class="admin-cards">



            <div class="admin-card">

                <h3>
                    Add Products
                </h3>

                <p>
                    Add new products to store.
                </p>

                <a href="add-product.html">

                    <button>
                        Open
                    </button>

                </a>

            </div>



            <div class="admin-card">

                <h3>
                    View Orders
                </h3>

                <p>
                    Check customer orders.
                </p>

                <a href="view-orders.html">

                    <button>
                        Open
                    </button>

                </a>

            </div>



            <div class="admin-card">

                <h3>
                    View Customers
                </h3>

                <p>
                    View registered users.
                </p>

                <a href="view-customers.html">

                    <button>
                        Open
                    </button>

                </a>

            </div>



        </div>

    </section>



    <script src="admin.js"></script>

</body>
</html>
